version: "3"

services:
  app:
    container_name: db_app_pablo
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MY_DATABASE_DRIVER: "mysql"
      DB_HOST: db  
      DB_USER_NAME: pablo
      DB_PASSWORD: rootpwd
      DB_NAME: database
      DB_PORT: 3306
    depends_on:
      - db
    ports:
      - 8081:3000
    restart: always
    networks:
      - my_network

  db:
    image: mysql:5.7
    container_name: db_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: database
      MYSQL_USER: pablo
      MYSQL_PASSWORD: rootpwd
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 3316:3306
    networks:
      - my_network

  dbBackup:
    image: fradelg/mysql-cron-backup
    container_name: dbBackup_pablo
    depends_on:
      - db
    restart: always
    volumes:
      - ./backup:/backup
    environment:
      - MYSQL_USER=pablo
      - MYSQL_PASS=rootpwd
      - MYSQL_DB=database
      - CRON_TIME=0 * * * *
      - MYSQL_HOST=db  
      - MYSQL_PORT=3306 
      - TIMEOUT=10s
      - INIT_BACKUP=1      
    networks:
      - my_network

volumes:
  db_data:

networks:
  my_network:
    driver: bridge
