version: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MY_DATABASE_DRIVER: "mysql"
      DB_HOST: db
      DB_USER_NAME: root
      DB_PASSWORD: rootpwd
      DB_NAME: database
      DB_PORT: 3310
    depends_on:
      - db
    ports:
      - 8081:3000
    restart: always
    networks:
      - my_network
  db:
    image: fradelg/mysql-cron-backup
    container_name: db_mysql_pablo
    environment:
      - MYSQL_USER=root
      - MYSQL_PASS=rootpwd
      - MYSQL_DB=database
      - CRON_TIME= 0 * * * *
      - MYSQL_HOST=db
      - MYSQL_PORT=3310
      - TIMEOUT=10s
      - INIT_BACKUP=1  
    volumes:
      - ./backup:/backup
    networks:
      - my_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  my_network:
    driver: bridge

