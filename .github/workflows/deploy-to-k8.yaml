name: Workflow to deploy on k8s or DigitalOcean

on:
  push:
    branches:
      - modificador

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear .env file basado en DB_DRIVER
        run: |
          echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          
          if [ "${{ secrets.DB_DRIVER }}" == "mysql" ]; then
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          elif [ "${{ secrets.DB_DRIVER }}" == "postgres" ]; then
            echo "POSTGRES_USER=${{ secrets.DB_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
          elif [ "${{ secrets.DB_DRIVER }}" == "mongo" ]; then
            echo "MONGO_INITDB_ROOT_USERNAME=${{ secrets.DB_USER }}" >> .env
            echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "MONGO_INITDB_DATABASE=${{ secrets.DB_NAME }}" >> .env
          fi

      - name: Construir imagen del backend
        run: |
          docker build -t ppablo1999/proyecto_final_pablo:latest ./src

      - name: Autenticando en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Publicar imagen en Docker Hub
        run: |
          docker push ppablo1999/proyecto_final_pablo:latest
  
  deploy:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar despliegue según el entorno
        run: |
          if [ "${{ secrets.RESOURCE }}" == "k8" ]; then
            echo "Desplegando en Kubernetes..."
            kubectl apply -f k8s.yaml
          elif [ "${{ secrets.RESOURCE }}" == "digital-ocean" ]; then
            echo "Desplegando en DigitalOcean Droplet..."
            ssh -o StrictHostKeyChecking=no ${{ secrets.DIGITAL_OCEAN_USER }}@${{ secrets.DIGITAL_OCEAN_HOST }} << 'EOF'
              cd /path/to/project
              echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" > .env
              docker-compose down
              docker-compose up -d --build
            EOF
          else
            echo "Error: RESOURCE no es válido"
            exit 1
          fi
