name: Workflow to deploy on k8s or DigitalOcean

on:
  push:
    branches:
      - modificador

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear .env file basado en DB_DRIVER
        run: |
          echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          
          if [ "${{ secrets.DB_DRIVER }}" = "mysql" ]; then
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          fi

      - name: Construir imagen del backend
        run: |
          docker build -t ppablo1999/proyecto_final_pablo_var:latest ./src

      - name: Autenticando en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Publicar imagen en Docker Hub
        run: |
          docker push ppablo1999/proyecto_final_pablo_var:latest
  
  deploy:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear base de datos y usuario si no existen
        run: |
          if [ "${{ secrets.DB_DRIVER }}" = "mysql" ]; then
            mysql -h ${{ secrets.DB_HOST }} -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_NAME }};"
            mysql -h ${{ secrets.DB_HOST }} -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}'; GRANT ALL PRIVILEGES ON ${{ secrets.DB_NAME }}.* TO '${{ secrets.DB_USER }}'@'%'; FLUSH PRIVILEGES;"
          elif [ "${{ secrets.DB_DRIVER }}" = "postgres" ]; then
            PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h ${{ secrets.DB_HOST }} -U postgres -c "CREATE DATABASE ${{ secrets.DB_NAME }};"
            PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h ${{ secrets.DB_HOST }} -U postgres -c "CREATE USER ${{ secrets.DB_USER }} WITH ENCRYPTED PASSWORD '${{ secrets.DB_PASSWORD }}'; GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.DB_NAME }} TO ${{ secrets.DB_USER }};"
          elif [ "${{ secrets.DB_DRIVER }}" = "mongo" ]; then
            mongo --host ${{ secrets.DB_HOST }} --username ${{ secrets.DB_USER }} --password ${{ secrets.DB_PASSWORD }} --eval "db.getSiblingDB('${{ secrets.DB_NAME }}').createCollection('init'); db.getSiblingDB('admin').runCommand({ createUser: '${{ secrets.DB_USER }}', pwd: '${{ secrets.DB_PASSWORD }}', roles: [{ role: 'readWrite', db: '${{ secrets.DB_NAME }}' }] });"
          fi

      - name: Configurar despliegue basado en el recurso seleccionado
        run: |
          if [ "${{ secrets.RESOURCE }}" = "k8" ]; then
            echo "Desplegando en Kubernetes..."
            kubectl apply -f k8s-deployment.yaml
          elif [ "${{ secrets.RESOURCE }}" = "digital-ocean" ]; then
            echo "Desplegando en DigitalOcean Droplet..."
            ssh -o StrictHostKeyChecking=no ${{ secrets.DIGITAL_OCEAN_USER }}@${{ secrets.DIGITAL_OCEAN_HOST }} << 'EOF'
            cd /path/to/project
            echo "DB_DRIVER=${{ secrets.DB_DRIVER }}" > .env
            docker-compose down
            docker-compose up -d --build
EOF
          else
            echo "Error: RESOURCE no es válido"
            exit 1
          fi
